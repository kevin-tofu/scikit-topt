name: Python tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (OpenGL for gmsh)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Run tests with coverage
        env:
          PYTHONPATH: scikit-topt
        run: poetry run pytest scikit-topt/tests --cov=sktopt --cov-report=xml

      - name: Run scikit-fem-native compatibility tests
        env:
          PYTHONPATH: scikit-topt
        run: poetry run pytest packages/scikit-fem-native/tests

      - name: Verify MMA with the native FEM backend
        env:
          SKTOPT_FEM_BACKEND: skfemntv
          PYTHONPATH: scikit-topt
        run: poetry run pytest -q scikit-topt/tests/test_mma_optimizer.py
