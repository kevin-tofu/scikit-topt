name: Python tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (OpenGL for gmsh)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.5.1"

      - name: Install dependencies
        run: poetry install

      - name: Run tests with coverage
        run: PYTHONPATH=scikit-topt poetry run pytest scikit-topt/tests --cov=sktopt --cov-report=xml
